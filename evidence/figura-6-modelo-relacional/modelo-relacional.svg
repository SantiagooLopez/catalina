xt><text x="1050" y="1303" text-anchor="end" font-size="11" fill="#60798c">integer</text><rect x="45" y="1140" width="460" height="182" rx="8" fill="#f4f7fa" stroke="#d5e1e9"/><text x="63" y="1168" font-size="15" font-weight="700" fill="#315a73">Lectura del modelo físico</text><text x="63" y="1196" class="small">PK: clave primaria · FK: clave foránea · ?: admite NULL</text><text x="63" y="1221" class="small">Las cardinalidades se leen origen → destino.</text><text x="63" y="1246" class="small">Cada versión tiene 0..1 ejecuciones activas referidas.</text><text x="63" y="1271" class="small">La FK activa no tiene restricción UNIQUE en el catálogo.</text><text x="63" y="1296" class="small">El rol de usuario se almacena como texto obligatorio.</text><line x1="45" y1="1360" x2="1065" y2="1360" stroke="#d3e1ea"/><text x="45" y="1388" class="small">Diagrama del núcleo: se omiten tablas auxiliares de auditoría, configuración, métricas, sesiones, migraciones y fragmentos.</text><text x="45" y="1413" class="small">Fuente: catálogo PostgreSQL del prototipo Catalina. Las conexiones no implican inserción de datos ni cambios del esquema.</text></svg>