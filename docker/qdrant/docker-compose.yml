services:

  
  qdrant:
   image: qdrant/qdrant:latest
   container_name: catalina-qdrant
   restart: unless-stopped

   ports:
    - "127.0.0.1:6333:6333"
    - "127.0.0.1:6334:6334"

   volumes:
    - /opt/catalina/qdrant/storage:/qdrant/storage

   networks:
    - catalina-network

networks:
  catalina-network:
    name: catalina-network

